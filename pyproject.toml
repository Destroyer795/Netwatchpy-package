[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "netwatchpy"
version = "1.4.0"
authors = [
    { name = "Pranav Kishan", email = "ty.pranavkishan7905@gmail.com" }
]
description = "A TUI network usage monitor."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["network", "monitor", "tui", "bandwidth", "usage", "textual", "cli"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Utilities",
]

dependencies = [
    "textual",
    "psutil",
    "desktop-notifier",
    "platformdirs"
]

[project.scripts]
netwatch = "netwatch.tui:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["netwatch"]

[project.urls]
Documentation = "https://destroyer795.github.io/Netwatchpy-package"
Homepage = "https://github.com/Destroyer795/Netwatchpy-package"
Issues = "https://github.com/Destroyer795/Netwatchpy-package/issues"